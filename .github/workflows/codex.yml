name: Codex plugin

on:
  push:
    branches: [main]
    paths:
      - "codex/**"
      - ".agents/plugins/**"
      - ".github/workflows/codex.yml"
  pull_request:
    paths:
      - "codex/**"
      - ".agents/plugins/**"
      - ".github/workflows/codex.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.22.3"]
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Assert zero dependencies
        run: |
          node -e '
            const p = require("./package.json");
            for (const k of ["dependencies", "devDependencies", "peerDependencies"]) {
              if (p[k] && Object.keys(p[k]).length) {
                console.error(`${k} must stay empty, found: ${Object.keys(p[k])}`);
                process.exit(1);
              }
            }
          '
      - name: Run tests
        run: npm test

  validate:
    name: Manifests and hook wiring
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
      # Not the Claude Code validator: this plugin is loaded by Codex, whose
      # rules differ in exactly the two ways that shipped it broken once -
      # hooks.json must live under hooks/, and CODEX_PLUGIN_ROOT does not exist.
      - name: Check manifests, hook locations and hook targets
        run: npm run check
      - name: Check the Codex marketplace manifest
        working-directory: .
        run: |
          node -e '
            const m = require("./.agents/plugins/marketplace.json");
            const p = (m.plugins ?? []).find((x) => x.name === "everos");
            if (!p) { console.error("marketplace.json does not list everos"); process.exit(1); }
            const fs = require("fs");
            if (!fs.existsSync(p.source.path)) {
              console.error(`marketplace.json points at ${p.source.path}, which does not exist`);
              process.exit(1);
            }
            console.log("  PASS  marketplace lists everos at", p.source.path);
          '
