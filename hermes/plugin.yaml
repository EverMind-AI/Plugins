name: everos
version: "1.1.0"
manifest_version: 1
requires_hermes: ">=0.19.0"
description: "EverOS-backed cross-session and cross-harness memory — markdown source of truth, hybrid recall, user + agent tracks, CWD context augmentation, and optional recall/retain tools."
hooks:
  - sync_turn
  - on_session_end
  - on_pre_compress
  - on_session_switch
  - on_memory_write
  - on_delegation
